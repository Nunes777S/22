<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura</title>
</head>
<body>
    <h1>Conversor de Temperatura</h1>

    <input type="number" id="entrada" placeholder="Digite a temperatura">
    <br>

    <button onclick="converterParaCelsius()">Converter para Celsius (de °F)</button>
    <button onclick="converterParaFahrenheit()">Converter para Fahrenheit (de °C)</button>
    <br>
    <button onclick="celsiusParaFahrenheit()">Celsius ➜ Fahrenheit</button>
    <button onclick="fahrenheitParaCelsius()">Fahrenheit ➜ Celsius</button>

    <div id="resultado"></div>

    <script>
        function converterParaCelsius() {
            let f = parseFloat(document.getElementById('entrada').value);
            if (!isNaN(f)) {
                let c = (f - 32) * 5 / 9;
                document.getElementById('resultado').innerText = `Resultado: ${c.toFixed(2)} °C`;
            } else {
                document.getElementById('resultado').innerText = 'Digite um valor válido.';
            }
        }

        function converterParaFahrenheit() {
            let c = parseFloat(document.getElementById('entrada').value);
            if (!isNaN(c)) {
                let f = (c * 9 / 5) + 32;
                document.getElementById('resultado').innerText = `Resultado: ${f.toFixed(2)} °F`;
            } else {
                document.getElementById('resultado').innerText = 'Digite um valor válido.';
            }
        }

        function celsiusParaFahrenheit() {
            let c = parseFloat(document.getElementById('entrada').value);
            if (!isNaN(c)) {
                let f = (c * 9 / 5) + 32;
                document.getElementById('resultado').innerText = `${c.toFixed(2)} °C = ${f.toFixed(2)} °F`;
            } else {
                document.getElementById('resultado').innerText = 'Digite um valor válido.';
            }
        }

        function fahrenheitParaCelsius() {
            let f = parseFloat(document.getElementById('entrada').value);
            if (!isNaN(f)) {
                let c = (f - 32) * 5 / 9;
                document.getElementById('resultado').innerText = `${f.toFixed(2)} °F = ${c.toFixed(2)} °C`;
            } else {
                document.getElementById('resultado').innerText = 'Digite um valor válido.';
            }
        }
    </script>
</body>
</html>
