<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>conversor de temperatura</title>
</head>
<body>
  <h1>Conversor de Temperatura</h1>

  <input type="number" id="entrada" placeholder="Digite a temperatura">
  <br>
  <button onclick="converterParaCelsius()">Converter para Celsius</button>
  <button onclick="converterParaFahrenheit()">Converter para Fahrenheit</button>

  <div id="resultado"></div>

  <script>
    function converterParaCelsius() {
      let f = parseFloat(document.getElementById('entrada').value);
      if (!isNaN(f)) {
        let c = (f - 32) * 5 / 9;
        document.getElementById('resultado').innerText = `Resultado: ${c.toFixed(2)} °C`;
      } else {
        document.getElementById('resultado').innerText = 'Digite um valor válido.';
      }
    }

    function converterParaFahrenheit() {
      let c = parseFloat(document.getElementById('entrada').value);
      if (!isNaN(c)) {
        let f = (c * 9 / 5) + 32;
        document.getElementById('resultado').innerText = `Resultado: ${f.toFixed(2)} °F`;
      } else {
        document.getElementById('resultado').innerText = 'Digite um valor válido.';
      }
    }
  </script>
</body>
</html>
